<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Brick Breaker — Arcade</title>
  <meta name="description" content="Jogo arcade de quebrar blocos feito em Canvas 2D com JavaScript puro. Meu primeiro projeto aberto no GitHub." />
  <meta name="theme-color" content="#08080f" />
  <meta name="color-scheme" content="dark" />

  <meta property="og:title" content="Brick Breaker — Arcade" />
  <meta property="og:description" content="Jogo arcade de quebrar blocos em Canvas 2D com JavaScript puro." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b16'/%3E%3Crect x='4' y='8' width='11' height='6' rx='1.5' fill='%23ff3d81'/%3E%3Crect x='17' y='8' width='11' height='6' rx='1.5' fill='%23ffb03a'/%3E%3Crect x='4' y='16' width='11' height='6' rx='1.5' fill='%2337e6ff'/%3E%3Crect x='17' y='16' width='11' height='6' rx='1.5' fill='%237c5cff'/%3E%3C/svg%3E" />
</head>
<body>
  <main class="cabinet">
    <header class="cabinet__header">
      <h1 class="logo">
        <span class="logo__word">BRICK</span><span class="logo__word logo__word--accent">BREAKER</span>
      </h1>
      <p class="tagline">quebre blocos &middot; não desista</p>
    </header>

    <section class="hud" aria-label="Placar">
      <div class="hud__stat">
        <span class="hud__label">Pontos</span>
        <span class="hud__value" id="hud-score">0</span>
      </div>
      <div class="hud__stat">
        <span class="hud__label">Recorde</span>
        <span class="hud__value hud__value--muted" id="hud-highscore">0</span>
      </div>
      <div class="hud__stat">
        <span class="hud__label">Nível</span>
        <span class="hud__value" id="hud-level">1</span>
      </div>
      <div class="hud__stat">
        <span class="hud__label">Vidas</span>
        <span class="hud__value hud__lives" id="hud-lives"></span>
      </div>
    </section>

    <div class="screen" id="screen">
      <canvas id="canvas" width="960" height="640" aria-label="Área de jogo"></canvas>
      <div class="screen__scanlines" aria-hidden="true"></div>
      <div class="screen__vignette" aria-hidden="true"></div>
      <div class="overlay" id="overlay" hidden></div>
    </div>

    <div class="actions">
      <button class="btn btn--primary" id="btn-start" type="button">Jogar</button>
      <button class="btn" id="btn-pause" type="button">Pausar</button>
      <button class="btn" id="btn-mute" type="button" aria-pressed="false">Som: ligado</button>
      <button class="btn" id="btn-restart" type="button">Reiniciar</button>
    </div>

    <footer class="cabinet__footer">
      <p class="hint">
        <kbd>&larr;</kbd> <kbd>&rarr;</kbd> ou <kbd>A</kbd> <kbd>D</kbd> mover &middot;
        mouse tamb&eacute;m &middot; <kbd>Espa&ccedil;o</kbd> servir &middot; <kbd>P</kbd> pausar
      </p>
    </footer>
  </main>

  <noscript>
    <p style="color:#fff;text-align:center;padding:2rem;font-family:sans-serif">
      Este jogo precisa de JavaScript habilitado.
    </p>
  </noscript>

  <script>
    // Aviso amigável caso os módulos ES não carreguem (ex.: abrindo o arquivo com file://).
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (window.__brickBreakerBooted) return;
        var overlay = document.getElementById('overlay');
        if (!overlay) return;
        overlay.hidden = false;
        overlay.innerHTML =
          '<div class="panel panel--error">' +
          '<h2 class="panel__title">Quase l&aacute;! ⚠</h2>' +
          '<p class="panel__text">O jogo usa <strong>m&oacute;dulos ES</strong>, que o navegador bloqueia quando a p&aacute;stina &eacute; aberta direto do disco (<code>file://</code>).</p>' +
          '<p class="panel__text">Para jogar, abra um terminal nesta pasta e rode:</p>' +
          '<pre class="panel__code">python -m http.server 8000</pre>' +
          '<p class="panel__text">Depois acesse <strong>http://localhost:8000</strong></p>' +
          '<p class="panel__text panel__text--small">No GitHub Pages o jogo funciona normalmente, sem esse passo.</p>' +
          '</div>';
      }, 600);
    });
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
